[project]
name = "smart-access-agent-system"
version = "0.1.0"
description = "合併專案：門禁與人臉辨識系統 + 勞基法/考勤 RAG AI 助理"
requires-python = ">=3.10"

# 依賴清單維護在 requirements/main.txt，安裝請執行：
#   pip install -r requirements/main.txt
# 這個檔案主要放專案資訊與 ruff、bandit 的設定。

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "models",
    "runtime",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S310", "S603", "S607"]
# 內含大量中文提示詞與訊息字串，拆行會改變內容或降低可讀性
"assistant/llm_settings.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m \"not integration and not regression\""
markers = [
    "integration: 用真的模型與服務的整合測試，只在本機執行（python -m pytest -m integration）",
    "regression: 辨識結果回歸測試，對照 tests/regression/baseline.json（python -m pytest -m regression）",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "models",
    "runtime",
    "data",
]
