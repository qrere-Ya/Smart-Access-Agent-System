[project]
name = "smart-access-agent-system"
version = "0.1.0"
description = "合併專案：門禁與人臉辨識系統 + 勞基法/考勤 RAG AI 助理"
requires-python = ">=3.10"

# 依賴清單維護在 requirements/main.txt，安裝請執行：
#   pip install -r requirements/main.txt
# 這個檔案主要放專案資訊與 ruff、bandit 的設定。

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "research/antispoof_training/venv_antispoof",
    "models",
    "runtime",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4"]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "research/antispoof_training/venv_antispoof",
    "models",
    "runtime",
    "data",
]
