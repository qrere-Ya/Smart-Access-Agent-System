[project]
name = "smart-access-agent-system"
version = "0.1.0"
description = "合併專案：門禁與人臉辨識系統 + 勞基法/考勤 RAG AI 助理"
requires-python = ">=3.10"

# 依賴清單維護在 requirements/main.txt，安裝請執行：
#   pip install -r requirements/main.txt
# 這個檔案主要放專案資訊與 ruff、bandit 的設定。

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "models",
    "runtime",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S310", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "models",
    "runtime",
    "data",
]
