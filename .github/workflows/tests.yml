name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt -c requirements/lock.txt
      - name: Run unit tests
        run: python -m pytest tests -q
