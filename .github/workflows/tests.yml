name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt -c requirements/lock.txt
      - name: Install a virtual display for the Tk window tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run unit tests
        run: xvfb-run -a python -m pytest tests -q

  ui:
    name: Window tests (customtkinter, virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt -c requirements/lock.txt
      - name: Install a virtual display for the Tk window tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run window tests (tests that need real models skip themselves)
        run: xvfb-run -a python -m pytest -m integration tests/integration -q
