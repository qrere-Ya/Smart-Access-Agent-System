model_list:
  - model_name: "claude-*"
    litellm_params:
      model: nvidia_nim/google/gemma-4-31b-it
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true

  # 2026-09-08: evaluate_rag.py's question-setter/judge calls the "gpt-4o"
  # alias (see get_judge_llm() in evaluate_rag.py for the full reason): the
  # OpenAI-compatible client library validates the model name locally
  # against known OpenAI model names before it will call out at all, and a
  # custom alias like "claude-*" fails that local check. Only a name that
  # looks like a real OpenAI model (e.g. "gpt-4o") passes it.
  - model_name: gpt-4o
    litellm_params:
      model: nvidia_nim/google/gemma-4-31b-it
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
